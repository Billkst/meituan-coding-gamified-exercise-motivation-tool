<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>PULSE · 大学生运动公会</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0e1a;
    --bg-deep: #060912;
    --panel: #111729;
    --panel-2: #161e36;
    --line: rgba(255,255,255,.06);
    --line-2: rgba(255,255,255,.10);
    --ink: #eef1f8;
    --ink-2: #aab3c8;
    --ink-3: #6a7493;
    --ink-4: #444d68;
    --acid: #b6ff3c;          /* primary neon */
    --acid-deep: #7cd820;
    --cyan: #4cf2ff;
    --magenta: #ff3d8a;
    --gold: #ffd166;
    --orange: #ff7a3d;
    --violet: #a78bfa;
    --hp: #ff5577;
    --mp: #4cf2ff;
    --xp: #b6ff3c;
    --rare: #4cf2ff;
    --epic: #a78bfa;
    --legend: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-deep); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: 'Bebas Neue', 'Manrope', sans-serif; letter-spacing: .02em; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.06); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.12); border: 2px solid transparent; background-clip: content-box; }

  /* base utils */
  .stripes-bg {
    background-image:
      linear-gradient(135deg, rgba(255,255,255,.02) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.02) 50%, rgba(255,255,255,.02) 75%, transparent 75%);
    background-size: 16px 16px;
  }
  .grid-bg {
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .scanlines::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }

  /* background ambient */
  .ambient {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(70% 50% at 20% 10%, rgba(76,242,255,.06), transparent 60%),
      radial-gradient(60% 50% at 90% 90%, rgba(182,255,60,.05), transparent 60%),
      radial-gradient(40% 30% at 60% 50%, rgba(167,139,250,.04), transparent 60%);
  }

  /* shell */
  .shell { position: relative; min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; z-index: 1; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; background: linear-gradient(180deg, #0c1124 0%, #080d1a 100%);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .main { min-height: 100vh; min-width: 0; }

  /* header */
  .topbar {
    height: 72px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); background: rgba(8,11,22,.7); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10;
  }

  /* generic surfaces */
  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, #0d1322 100%);
    border: 1px solid var(--line); border-radius: 16px; position: relative;
  }
  .panel.elev { box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px rgba(0,0,0,.4); }
  .panel.tile {
    background: linear-gradient(180deg, var(--panel) 0%, #0a0f1c 100%);
  }
  .panel.acid {
    border: 1px solid rgba(182,255,60,.3);
    background: linear-gradient(180deg, rgba(182,255,60,.08) 0%, rgba(182,255,60,.02) 100%);
  }
  .corner-ticks::before, .corner-ticks::after {
    content: ''; position: absolute; width: 14px; height: 14px;
    border: 1px solid rgba(182,255,60,.55);
  }
  .corner-ticks::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .corner-ticks::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* primary button */
  .btn {
    appearance: none; border: 0; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 10px; justify-content: center;
    padding: 12px 20px; border-radius: 10px; font-weight: 700; letter-spacing: .02em;
    transition: transform .12s, box-shadow .12s, background .12s, color .12s;
  }
  .btn-acid {
    background: var(--acid); color: #0a0e1a;
    box-shadow: 0 0 0 1px rgba(182,255,60,.4), 0 8px 24px rgba(182,255,60,.25);
  }
  .btn-acid:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(182,255,60,.5), 0 12px 32px rgba(182,255,60,.35); }
  .btn-ghost {
    background: rgba(255,255,255,.04); color: var(--ink); border: 1px solid var(--line-2);
  }
  .btn-ghost:hover { background: rgba(255,255,255,.08); }
  .btn-magenta {
    background: var(--magenta); color: #fff;
    box-shadow: 0 0 0 1px rgba(255,61,138,.4), 0 8px 24px rgba(255,61,138,.25);
  }

  /* chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    background: rgba(255,255,255,.06); color: var(--ink-2);
    white-space: nowrap; flex-shrink: 0;
  }
  .chip.acid { background: rgba(182,255,60,.15); color: var(--acid); }
  .chip.cyan { background: rgba(76,242,255,.12); color: var(--cyan); }
  .chip.magenta { background: rgba(255,61,138,.14); color: var(--magenta); }
  .chip.gold { background: rgba(255,209,102,.14); color: var(--gold); }
  .chip.violet { background: rgba(167,139,250,.14); color: var(--violet); }

  /* HUD bars */
  .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; position: relative; }
  .bar > i { position: absolute; inset: 0; right: auto; border-radius: 999px; }
  .bar.thin { height: 4px; }
  .bar.thick { height: 14px; }

  /* placeholder image */
  .ph {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 6px, rgba(255,255,255,.01) 6px 12px),
      linear-gradient(180deg, #1a2238 0%, #0c1326 100%);
    border: 1px dashed rgba(255,255,255,.10);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.35); font-family: 'JetBrains Mono', monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: .12em; text-align: center;
  }

  /* utility text */
  .label-tiny { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
  .label-sm { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  .h1 { font-family: 'Bebas Neue', sans-serif; font-size: 56px; line-height: 1; letter-spacing: .02em; }
  .h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; line-height: 1; letter-spacing: .02em; }
  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* glow text */
  .glow-acid { color: var(--acid); text-shadow: 0 0 12px rgba(182,255,60,.5); }
  .glow-cyan { color: var(--cyan); text-shadow: 0 0 12px rgba(76,242,255,.5); }

  /* shake/pulse animations */
  @keyframes pulse-acid { 0%,100% { box-shadow: 0 0 0 0 rgba(182,255,60,.4); } 50% { box-shadow: 0 0 0 8px rgba(182,255,60,0); } }
  @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:.2} }
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .live-dot { display:inline-block; width:8px; height:8px; border-radius:999px; background: var(--magenta); animation: blink 1s infinite; }

  /* dividers */
  .hr { height:1px; background: var(--line); }
</style>

<!-- React + Babel pinned -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

</head>
<body>
  <div class="ambient"></div>
  <div id="root"></div>

  <script>
    window.TWEAK_DEFAULTS = {
      "accent": "#b6ff3c",
      "currentScreen": "dashboard",
      "showGrid": true,
      "intensity": "high"
    };
  </script>

<script type="text/babel" data-presets="react">
// ════════════════════════════════════════════════════════════════════════════
// Shared UI primitives (was components.jsx)
// ════════════════════════════════════════════════════════════════════════════
const { useState, useEffect } = React;

const cls = (...a) => a.filter(Boolean).join(' ');

// ICONS — minimal stroke set, all 1.5px stroke, currentColor
const Icon = ({ name, size = 18, stroke = 1.6 }) => {
  const paths = {
    home: <><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></>,
    bolt: <><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></>,
    target: <><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></>,
    sword: <><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></>,
    shield: <><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></>,
    flag: <><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></>,
    medal: <><circle cx="12" cy="14" r="6"/><path d="M9 4l3 6 3-6"/><path d="M9 4h6"/></>,
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></>,
    bag: <><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></>,
    chat: <><path d="M21 12c0 4-4 7-9 7-1.5 0-3-.3-4-.7L3 20l1.4-4C3.5 14.7 3 13.4 3 12c0-4 4-7 9-7s9 3 9 7z"/></>,
    plus: <><path d="M12 5v14M5 12h14"/></>,
    play: <><path d="M7 4l13 8-13 8z" fill="currentColor"/></>,
    pause: <><path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/></>,
    stop: <><rect x="5" y="5" width="14" height="14" fill="currentColor"/></>,
    fire: <><path d="M12 3c0 4-4 5-4 9a4 4 0 008 0c0-2-1-3-1-5 2 1 3 3 3 5a6 6 0 11-12 0c0-5 6-5 6-9z"/></>,
    heart: <><path d="M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/></>,
    run: <><circle cx="14" cy="4.5" r="1.5"/><path d="M5 12l4-2 2 4 4-2-2 5 4 4"/><path d="M9 22l2-5"/></>,
    bike: <><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-7h5l-3-4"/><path d="M14 6h3"/></>,
    dumbbell: <><path d="M3 9v6M21 9v6M6 7v10M18 7v10"/><path d="M6 12h12"/></>,
    yoga: <><circle cx="12" cy="4" r="2"/><path d="M12 7v6M5 21l7-8 7 8"/></>,
    chevron: <><path d="M9 6l6 6-6 6"/></>,
    chevronD: <><path d="M6 9l6 6 6-6"/></>,
    star: <><path d="M12 3l2.6 5.5 6 .9-4.3 4.2 1 6L12 16.8 6.7 19.6l1-6L3.4 9.4l6-.9z"/></>,
    map: <><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1A2 2 0 113 16.9l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H1a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8L2.1 7A2 2 0 014.9 4l.1.1a1.7 1.7 0 001.8.3H7a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1A2 2 0 1117.7 7l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H19a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></>,
    bell: <><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9z"/><path d="M10 21a2 2 0 004 0"/></>,
    coin: <><circle cx="12" cy="12" r="9"/><path d="M9 9h4a2 2 0 010 4h-3a2 2 0 000 4h4M12 6v2M12 16v2"/></>,
    crown: <><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></>,
    lock: <><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 018 0v4"/></>,
    check: <><path d="M5 12l4 4 10-10"/></>,
    x: <><path d="M6 6l12 12M18 6L6 18"/></>,
    arrowR: <><path d="M5 12h14M13 5l7 7-7 7"/></>,
    timer: <><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></>,
    pin: <><path d="M12 21s-7-7-7-12a7 7 0 0114 0c0 5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></>,
    grid: <><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth={stroke}
         strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {paths[name] || null}
    </svg>
  );
};

// HUD BARS
const ProgressBar = ({ value, max = 100, color = 'var(--acid)', glow = false, height = 8, segmented = false }) => {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return (
    <div className="bar" style={{ height }}>
      <i style={{
        width: `${pct}%`,
        background: color,
        boxShadow: glow ? `0 0 12px ${color}` : 'none',
        backgroundImage: segmented
          ? `repeating-linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,.35) 7px 8px)`
          : 'none',
      }} />
    </div>
  );
};

const StatBar = ({ label, value, max, color, abbr }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
      <span className="label-tiny" style={{ color }}>{abbr || label}</span>
      <span className="num" style={{ fontSize: 12, color: 'var(--ink-2)' }}>
        <b style={{ color: 'var(--ink)' }}>{value}</b> / {max}
      </span>
    </div>
    <ProgressBar value={value} max={max} color={color} glow height={6} />
  </div>
);

// AVATAR — geometric badge, no real photo
const Avatar = ({ seed = 'A', size = 40, level, ring, color }) => {
  const colors = ['#b6ff3c', '#4cf2ff', '#ff3d8a', '#ffd166', '#a78bfa', '#ff7a3d'];
  const idx = (seed.charCodeAt(0) || 0) % colors.length;
  const c = color || colors[idx];
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <div style={{
        width: size, height: size, borderRadius: '50%',
        background: `conic-gradient(from 200deg, ${c}, #0c1124, ${c})`,
        padding: 2, boxSizing: 'border-box',
      }}>
        <div style={{
          width: '100%', height: '100%', borderRadius: '50%',
          background: '#0c1124',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: 'Bebas Neue, sans-serif', fontSize: size * 0.45,
          color: c, letterSpacing: '.04em',
        }}>{seed}</div>
      </div>
      {level != null && (
        <div style={{
          position: 'absolute', right: -2, bottom: -2,
          minWidth: 18, height: 18, padding: '0 4px',
          borderRadius: 4, background: c, color: '#0a0e1a',
          fontFamily: 'JetBrains Mono, monospace', fontSize: 10, fontWeight: 700,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '2px solid #0c1124',
        }}>{level}</div>
      )}
    </div>
  );
};

// PANEL with corner ticks (HUD style)
const HudPanel = ({ children, style, label, action, padding = 24 }) => (
  <div className="panel elev" style={{ position: 'relative', ...style }}>
    {(label || action) && (
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        padding: '14px 20px', borderBottom: '1px solid var(--line)',
      }}>
        <div className="label-sm" style={{ color: 'var(--ink-2)' }}>{label}</div>
        <div>{action}</div>
      </div>
    )}
    <div style={{ padding }}>{children}</div>
  </div>
);

// SECTION HEADER
const SectionHeader = ({ kicker, title, action }) => (
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 16, gap: 16 }}>
    <div style={{ minWidth: 0 }}>
      {kicker && <div className="label-tiny" style={{ color: 'var(--acid)', marginBottom: 6, whiteSpace: 'nowrap' }}>{kicker}</div>}
      <div className="display" style={{ fontSize: 32, color: 'var(--ink)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{title}</div>
    </div>
    <div style={{ flexShrink: 0 }}>{action}</div>
  </div>
);

// QUEST CARD
const QuestCard = ({ icon, title, desc, progress, max, xp, coin, rarity = 'common', completed, onClaim }) => {
  const rarityColor = { common: 'var(--ink-3)', rare: 'var(--rare)', epic: 'var(--epic)', legend: 'var(--legend)' }[rarity];
  const pct = Math.min(100, (progress / max) * 100);
  const done = progress >= max;
  return (
    <div className="panel tile" style={{
      padding: 18, display: 'flex', flexDirection: 'column', gap: 14,
      borderColor: done ? 'rgba(182,255,60,.35)' : 'var(--line)',
    }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 14 }}>
        <div style={{
          width: 48, height: 48, borderRadius: 10,
          background: `linear-gradient(135deg, ${rarityColor}22, transparent)`,
          border: `1px solid ${rarityColor}55`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: rarityColor, flexShrink: 0,
        }}>
          <Icon name={icon} size={22} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
            <div style={{ fontWeight: 700, fontSize: 15, minWidth: 0, lineHeight: 1.3 }}>{title}</div>
            <div className="label-tiny mono" style={{ color: rarityColor, flexShrink: 0, fontSize: 9, whiteSpace: 'nowrap' }}>{rarity.toUpperCase()}</div>
          </div>
          <div style={{ color: 'var(--ink-2)', fontSize: 13, marginTop: 6, lineHeight: 1.4 }}>{desc}</div>
        </div>
      </div>
      <div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <span className="num" style={{ fontSize: 11, color: 'var(--ink-3)' }}>
            进度 <b style={{ color: 'var(--ink)' }}>{progress}</b> / {max}
          </span>
          <span className="num" style={{ fontSize: 11, color: 'var(--acid)' }}>{Math.round(pct)}%</span>
        </div>
        <ProgressBar value={progress} max={max} color={done ? 'var(--acid)' : rarityColor} glow={done} segmented />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
        <div style={{ display: 'flex', gap: 8 }}>
          {xp && <span className="chip acid">+{xp} XP</span>}
          {coin && <span className="chip gold">+{coin} ⊙</span>}
        </div>
        {done && !completed && (
          <button className="btn btn-acid" style={{ padding: '6px 14px', fontSize: 12 }} onClick={onClaim}>
            领取
          </button>
        )}
        {completed && (
          <span className="chip acid"><Icon name="check" size={12}/> 已领取</span>
        )}
      </div>
    </div>
  );
};

// HEAT CELL ROW (calendar / weekly)
const HeatRow = ({ days = [] }) => (
  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 6 }}>
    {days.map((d, i) => {
      const hasWorkout = d.value > 0;
      const intensity = Math.min(1, d.value / 100);
      return (
        <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <div className="label-tiny" style={{ fontSize: 9, color: 'var(--ink-3)' }}>{d.label}</div>
          <div style={{
            width: '100%', aspectRatio: '1', borderRadius: 8,
            background: hasWorkout

const HeartLine = () => {
  const pts = [];
  const w = 600, h = 60;
  for (let i = 0; i <= 60; i++) {
    const x = (i / 60) * w;
    const noise = Math.sin(i * 0.7) * 8 + Math.sin(i * 0.3) * 4;
    const spike = (i % 10 === 0) ? -18 : 0;
    const y = h / 2 + noise + spike + (Math.random() - .5) * 4;
    pts.push(`${x},${y}`);
  }
  return (
    <div className="panel tile" style={{ padding: 8, height: 80 }}>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="100%" preserveAspectRatio="none">
        <defs>
          <linearGradient id="hr-grad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor="rgba(255,61,138,.4)"/>
            <stop offset="100%" stopColor="rgba(255,61,138,0)"/>
          </linearGradient>
        </defs>
        <polyline points={pts.join(' ')} fill="none" stroke="var(--magenta)" strokeWidth="1.6"/>
        <polygon points={`0,${h} ${pts.join(' ')} ${w},${h}`} fill="url(#hr-grad)"/>
      </svg>
    </div>
  );
};

        <span style={{ color: 'var(--ink-4)' }}>/</span>
        <span style={{ fontSize: 14, fontWeight: 600 }}>{cur?.label}</span>
        <span style={{ color: 'var(--ink-4)', marginLeft: 16 }}>·</span>
        <span className="chip" style={{ background: 'rgba(76,242,255,.08)', color: 'var(--cyan)', border: '1px solid rgba(76,242,255,.2)' }}>
          <Icon name="pin" size={11}/> 知行大学 · 计算机学院 · 405 寝
        </span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '6px 14px', borderRadius: 999,
          background: 'rgba(255,255,255,.03)', border: '1px solid var(--line)',
        }}>
          <Icon name="coin" size={14} stroke={1.6}/>
          <span className="num" style={{ fontSize: 13, fontWeight: 700, color: 'var(--gold)' }}>3,240</span>
          <span className="num" style={{ fontSize: 11, color: 'var(--ink-3)' }}>⊙</span>
        </div>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 6,
          padding: '6px 14px', borderRadius: 999,
          background: 'rgba(255,61,138,.08)', border: '1px solid rgba(255,61,138,.2)',
        }}>
          <Icon name="fire" size={14} stroke={1.6}/>
          <span className="num" style={{ fontSize: 13, fontWeight: 700, color: 'var(--magenta)' }}>14</span>
          <span className="label-tiny" style={{ color: 'var(--magenta)', fontSize: 9 }}>STREAK</span>
        </div>
        <button style={{
          background: 'rgba(255,255,255,.03)', border: '1px solid var(--line)', color: 'var(--ink-2)',
          width: 36, height: 36, borderRadius: 8, cursor: 'pointer', position: 'relative',
        }}>
          <Icon name="bell" size={16}/>
          <span style={{
            position: 'absolute', top: 6, right: 6, width: 6, height: 6,
            borderRadius: '50%', background: 'var(--magenta)',
          }}/>
        </button>
      </div>
    </header>
  );
}

function App() {
  const [current, setCurrent] = useState(window.TWEAK_DEFAULTS.currentScreen || 'dashboard');
  const [claimed, setClaimed] = useState(['q2']);

  useEffect(() => {
    const accent = window.TWEAK_DEFAULTS.accent;
    if (accent && accent !== '#b6ff3c') {
      document.documentElement.style.setProperty('--acid', accent);
    }
  }, []);

  const navigate = (id) => {
    setCurrent(id);
    window.scrollTo({ top: 0 });
  };

  const onClaim = (id) => setClaimed(c => c.includes(id) ? c : [...c, id]);

  const screens = {
    dashboard: <DashboardScreen navigate={navigate} claimed={claimed} onClaim={onClaim}/>,
    sports:    <SportsScreen navigate={navigate}/>,
    workout:   <WorkoutScreen navigate={navigate}/>,
    loot:      <LootScreen navigate={navigate}/>,
    guild:     <GuildScreen navigate={navigate}/>,
    arena:     <ArenaScreen navigate={navigate}/>,
    codex:     <CodexScreen navigate={navigate}/>,
    shop:      <ShopScreen navigate={navigate}/>,
    feed:      <FeedScreen navigate={navigate}/>,
  };

  return (
    <div className="shell">
      <Sidebar current={current} onNavigate={navigate}/>
      <main className="main">
        <Topbar current={current} navigate={navigate}/>
        {screens[current] || screens.dashboard}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
