name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fake Supabase env vars so the bundle builds + runtime supabase client
    # constructs without throwing. Smoke tests only need the React shell to
    # render; real Supabase calls fail and the unauthenticated branch (user=null)
    # takes over, which renders the public ClashHome surface.
    env:
      VITE_SUPABASE_URL: https://stub.supabase.co
      VITE_SUPABASE_ANON_KEY: stub-anon-key-for-ci-only
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run unit tests
        run: bun run test

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Run Playwright tests
        run: bunx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
